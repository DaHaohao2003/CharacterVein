[tool.uv.workspace]
members = [
    "apps/api",
    "packages/domain",
    "packages/workflows",
    "packages/retrieval",
    "packages/providers",
    "packages/exporters",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "apps/api/src",
    "packages/domain/src",
    "packages/workflows/src",
    "packages/retrieval/src",
    "packages/providers/src",
    "packages/exporters/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "character_vein_api",
    "character_vein_domain",
    "character_vein_exporters",
    "character_vein_providers",
    "character_vein_retrieval",
    "character_vein_workflows",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
