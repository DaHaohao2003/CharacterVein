name: character-vein

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-character_vein}
      POSTGRES_USER: ${POSTGRES_USER:-character_vein}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-character_vein_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-character_vein}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-character_vein_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-character_vein}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-character_vein_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-character-vein}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"

  glyph-seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://character_vein:character_vein_dev@postgres:5432/character_vein}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-character_vein}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-character_vein_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-character-vein}
      S3_REGION: ${S3_REGION:-us-east-1}
      GLYPH_IMAGE_ROOT: /data/jiezi-images
      GLYPH_OBJECT_PREFIX: jiezi-demo
    entrypoint: ["apps/api/glyph-seed-entrypoint.sh"]
    volumes:
      - ../.data/jiezi/JieZi-Dataset/images:/data/jiezi-images:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  evidence-seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://character_vein:character_vein_dev@postgres:5432/character_vein}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-aliyun-bailian}
    entrypoint: ["apps/api/evidence-seed-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://character_vein:character_vein_dev@postgres:5432/character_vein}
      CHECKPOINT_DATABASE_URL: ${CHECKPOINT_DATABASE_URL:-postgresql://character_vein:character_vein_dev@postgres:5432/character_vein}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-character_vein}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-character_vein_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-character-vein}
      S3_REGION: ${S3_REGION:-us-east-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-flash}
      LLM_AUDIT_ENABLED: ${LLM_AUDIT_ENABLED:-true}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      VLM_PROVIDER: ${VLM_PROVIDER:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-aliyun-bailian}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-qwen3.8-flash}
    ports:
      - "8000:8000"
    depends_on:
      glyph-seed:
        condition: service_completed_successfully
      evidence-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-字脉}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
